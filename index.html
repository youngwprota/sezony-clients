<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141414">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Sезоны онлайн-запись</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Макет: узкая колонка приложения (как виджет YCLIENTS) под тонкой демо-панелью переключения ролей.
   Приложение салона светлое, поэтому страница намеренно в одной светлой теме. */
:root {
  --bg: #ffffff;
  --app-gray: #f5f5f6;
  --ink: #141414;
  --muted: #86868b;
  --line: #ebebed;
  --chip: #f0f0f2;
  --ok: #2f9e44;
  --danger: #d93f45;
  --link: #2459c9;
  --st-booked-bg: #fff8e6; --st-booked: #e8a20c;
  --st-conf-bg: #eef0ff; --st-conf: #5b63e6;
  --st-arr-bg: #ebf8ee; --st-arr: #2f9e44;
  --st-no-bg: #fdecec; --st-no: #d93f45;
  --font: "Golos Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 var(--font); -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--ink); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
input, select, textarea { font: inherit; color: var(--ink); }
.muted { color: var(--muted); }
.sm { font-size: 14px; }
.xs { font-size: 12px; }
.b { font-weight: 600; }

/* демо-панель */
.demo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--ink); color: #fff;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.demo-in { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.demo-label { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; opacity: .65; }
.seg { display: flex; background: rgba(255,255,255,.12); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { padding: 6px 12px; border-radius: 9px; font-size: 14px; color: #fff; }
.seg button[aria-pressed="true"] { background: #fff; color: var(--ink); font-weight: 500; }
.demo-note { font-size: 12px; opacity: .65; margin-left: auto; }
@media (max-width: 560px) { .demo-note { display: none; } }

/* колонка клиентского приложения */
.col { max-width: 600px; margin: 0 auto; min-height: calc(100% - 50px); display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.hdr { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 50px); z-index: 20; background: var(--bg); height: 52px; display: flex; align-items: center; gap: 10px; margin: 0 -16px; padding: 0 16px; }
.icon-btn { width: 34px; height: 34px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; }
.icon-btn:hover { background: var(--chip); }
h1.big { font-size: 26px; font-weight: 700; margin: 4px 0 16px; text-wrap: balance; }
.menu-row { display: flex; align-items: center; gap: 16px; padding: 8px 0; width: 100%; text-align: left; }
.circle { width: 48px; height: 48px; border-radius: 50%; background: var(--chip); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 500; color: #555; font-size: 18px; }
.grow { flex: 1; min-width: 0; }
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.clamp1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.foot { margin-top: auto; padding: 28px 0; text-align: center; color: var(--muted); font-size: 14px; }
.bottom { position: sticky; bottom: 0; z-index: 20; background: var(--bg); border-top: 1px solid var(--line); margin: 16px -16px 0; padding: 12px 16px max(12px, env(safe-area-inset-bottom, 0px)); }
.primary { display: flex; width: 100%; height: 52px; align-items: center; justify-content: center; background: var(--ink); color: #fff; border-radius: 16px; font-weight: 500; font-size: 16px; }
.primary:disabled { opacity: .35; cursor: default; }
.secondary { height: 44px; padding: 0 16px; border-radius: 12px; background: var(--chip); font-size: 15px; }
.radio { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.radio.on { border-color: var(--ink); }
.radio.on::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); }
.chk { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #fff; }
.chk.on { background: var(--ink); border-color: var(--ink); }
.slots-row { display: flex; gap: 8px; overflow-x: auto; margin-right: -16px; padding-right: 16px; scrollbar-width: none; }
.slots-row::-webkit-scrollbar { display: none; }
.slot { height: 40px; padding: 0 16px; border-radius: 12px; background: var(--chip); flex-shrink: 0; font-size: 15px; font-variant-numeric: tabular-nums; }
.slot.on { background: var(--ink); color: #fff; }
.staff-item { padding-top: 16px; }
.staff-item.off { opacity: .45; }
.stars { color: #f5a623; font-size: 13px; letter-spacing: 1px; }
.search { display: flex; align-items: center; gap: 8px; height: 44px; border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; }
.search input { border: 0; outline: 0; flex: 1; height: 100%; background: transparent; }
.sticky-tools { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 102px); z-index: 15; background: var(--bg); margin: 0 -16px; padding: 0 16px 8px; }
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 12px -16px 0; padding: 0 16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { height: 40px; padding: 0 12px; border-radius: 12px; background: var(--chip); white-space: nowrap; font-size: 14px; flex-shrink: 0; }
.chip.on { background: var(--ink); color: #fff; }
.cat-h { font-size: 20px; font-weight: 700; margin: 18px 0 2px; scroll-margin-top: 170px; }
.svc { border-bottom: 1px solid var(--line); padding: 14px 0; }
.svc:last-child { border-bottom: 0; }
.svc-top { display: flex; gap: 12px; width: 100%; text-align: left; }
.svc-meta { margin-top: 4px; color: var(--muted); font-size: 14px; }
.svc-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
.more { color: var(--muted); font-size: 14px; margin-right: 36px; }
.cal { margin: 0 -16px; padding: 0 16px 14px; border-radius: 0 0 24px 24px; box-shadow: 0 10px 18px -14px rgba(0,0,0,.25); }
.cal-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; row-gap: 4px; }
.cal-grid .wd { color: var(--muted); font-size: 14px; padding: 6px 0; }
.day { width: 44px; height: 44px; margin: 0 auto; border-radius: 12px; font-size: 16px; font-variant-numeric: tabular-nums; }
.day.av { font-weight: 600; }
.day.na { color: #c9c9cd; cursor: default; }
.day.sel { background: var(--ink); color: #fff; }
.day.today { text-decoration: underline; text-underline-offset: 4px; }
.day.hide { visibility: hidden; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; text-align: center; margin-bottom: 6px; }
.tabs button { padding-bottom: 8px; border-bottom: 2px solid var(--line); color: var(--muted); }
.tabs button.on { border-color: var(--ink); color: var(--ink); }
.slot-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
@media (min-width: 480px) { .slot-grid { grid-template-columns: repeat(4, 1fr); } }
.part-h { font-size: 17px; font-weight: 500; margin: 16px 0 10px; }
.detail { display: flex; align-items: center; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 14px; color: var(--muted); }
.inp { height: 48px; border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; outline: 0; background: var(--bg); width: 100%; }
.inp:focus { border-color: var(--ink); }
textarea.inp { height: 96px; padding: 10px 12px; resize: none; }
.phone { display: flex; height: 48px; border: 1px solid var(--line); border-radius: 12px; align-items: center; }
.phone span { padding: 0 12px; border-right: 1px solid var(--line); line-height: 48px; }
.phone input { flex: 1; border: 0; outline: 0; height: 100%; padding: 0 12px; border-radius: 0 12px 12px 0; min-width: 0; }
.err { background: var(--st-no-bg); color: var(--danger); padding: 10px 12px; border-radius: 12px; }
.row-between { display: flex; justify-content: space-between; gap: 12px; }
.done-badge { width: 64px; height: 64px; border-radius: 50%; background: var(--ok); color: #fff; display: flex; align-items: center; justify-content: center; margin: 0 auto; }
.stack { display: flex; flex-direction: column; gap: 14px; }

/* мастер */
.m-wrap { max-width: 600px; margin: 0 auto; background: var(--app-gray); min-height: calc(100% - 50px); padding-bottom: 32px; }
.m-top { background: var(--bg); padding: 14px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 12px; }
.m-days { background: var(--bg); display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 12px; scrollbar-width: none; }
.m-days::-webkit-scrollbar { display: none; }
.m-day { width: 50px; flex-shrink: 0; border-radius: 16px; background: var(--chip); padding: 7px 0; display: flex; flex-direction: column; align-items: center; position: relative; }
.m-day.on { background: var(--ink); color: #fff; }
.m-day .dot { position: absolute; top: 5px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
.m-sec { padding: 16px 16px 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.card { background: var(--bg); border-radius: 18px; padding: 16px; }
.card.new { box-shadow: inset 0 0 0 2px var(--ink); }
.pill { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--chip); white-space: nowrap; }
.pill.dark { background: var(--ink); color: #fff; }
.pill.BOOKED { background: var(--st-booked-bg); color: #8a5a00; }
.pill.CONFIRMED { background: var(--st-conf-bg); color: #3b40a8; }
.pill.ARRIVED { background: var(--st-arr-bg); color: #1f6b2f; }
.pill.NO_SHOW { background: var(--st-no-bg); color: #a12a2f; }
.pill.CANCELLED { color: var(--muted); text-decoration: line-through; }
.call { width: 40px; height: 40px; border-radius: 50%; background: var(--chip); display: flex; align-items: center; justify-content: center; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tel { color: var(--link); font-size: 14px; user-select: all; }

/* админка */
.a-wrap { max-width: 1100px; margin: 0 auto; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.a-nav { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.a-nav button { padding: 8px 14px; border-radius: 12px; }
.a-nav button.on { background: var(--ink); color: #fff; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.jr { overflow: auto; border: 1px solid var(--line); border-radius: 16px; max-height: calc(100dvh - 210px); background: var(--bg); }
.jr-in { position: relative; }
.jr-head { position: sticky; top: 0; z-index: 4; display: flex; background: var(--bg); border-bottom: 1px solid var(--line); }
.jr-corner { position: sticky; left: 0; z-index: 5; width: 50px; flex-shrink: 0; background: var(--bg); }
.jr-col-h { width: 150px; flex-shrink: 0; border-left: 1px solid var(--line); padding: 8px; }
.jr-body { display: flex; position: relative; }
.jr-times { position: sticky; left: 0; z-index: 3; width: 50px; flex-shrink: 0; background: var(--bg); }
.jr-t { position: relative; font-size: 11px; color: var(--muted); text-align: right; padding-right: 6px; font-variant-numeric: tabular-nums; }
.jr-col { position: relative; width: 150px; flex-shrink: 0; border-left: 1px solid var(--line); }
.jr-cell { display: block; width: 100%; }
.jr-cell.h { border-top: 1px solid var(--line); }
.jr-cell.off { background: repeating-linear-gradient(135deg, #f8f8f9, #f8f8f9 6px, #f0f0f2 6px, #f0f0f2 12px); }
.jr-cell:hover { background-color: var(--chip); }
.appt { position: absolute; left: 3px; right: 3px; border-radius: 8px; border-left: 4px solid; padding: 3px 6px; font-size: 12px; text-align: left; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.08); line-height: 1.3; }
.appt.BOOKED { background: var(--st-booked-bg); border-color: var(--st-booked); }
.appt.CONFIRMED { background: var(--st-conf-bg); border-color: var(--st-conf); }
.appt.ARRIVED { background: var(--st-arr-bg); border-color: var(--st-arr); }
.appt.NO_SHOW { background: var(--st-no-bg); border-color: var(--st-no); }
.now { position: absolute; left: 50px; right: 0; border-top: 2px solid var(--danger); z-index: 2; pointer-events: none; }
.svc-cat { background: var(--bg); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin-bottom: 12px; }
.svc-line { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; width: 100%; text-align: left; padding: 9px 0; border-top: 1px solid var(--line); }
.svc-line:hover { background: var(--app-gray); }
.st-btns { display: flex; flex-wrap: wrap; gap: 6px; }
.st-btn { height: 36px; padding: 0 12px; border-radius: 10px; border-left: 4px solid; font-size: 14px; }
.st-btn.sel { box-shadow: 0 0 0 2px var(--ink); }

/* шторка и уведомление */
.ov { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 640px) { .ov { align-items: center; } }
.sheet { background: var(--bg); width: 100%; max-width: 600px; max-height: 90dvh; overflow-y: auto; border-radius: 24px 24px 0 0;
  padding: 18px max(20px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); }
@media (min-width: 640px) { .sheet { border-radius: 24px; } }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 14px; }
.toast { position: fixed; z-index: 80; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 60px); width: min(92vw, 420px);
  background: rgba(30,30,32,.96); color: #fff; border-radius: 16px; padding: 12px 14px; box-shadow: 0 10px 30px rgba(0,0,0,.25); font-size: 14px; animation: drop .35s ease-out; }
.toast b { display: block; margin-bottom: 2px; }
@keyframes drop { from { transform: translate(-50%, -16px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } * { scroll-behavior: auto !important; } }
</style>

</head>
<body>
<div class="demo">
  <div class="demo-in">
    <span class="demo-label">Демо</span>
    <div class="seg" role="group" aria-label="Кем смотреть">
      <button data-a="mode" data-v="client">Клиент</button>
      <button data-a="mode" data-v="master">Мастер</button>
      <button data-a="mode" data-v="admin">Админ</button>
    </div>
    <span class="demo-note">Записи сохраняются только на этом устройстве</span>
  </div>
</div>
<div id="app"></div>
<div id="sheet-root"></div>
<div id="toast-root"></div>

операционный лифтинг, уменьшение объемов щек, второго подбородка, разглаживание морщин.","p":[120.0,120.0],"m":60},{"id":7,"c":10,"t":"Процедура ухода Guinot Lift Sammum","d":"Мануальная процедура омоложения. Альтернатива инъекционным процедурам. Направлена на восстановление упругости кожи лица, шеи, декольте.","p":[250.0,250.0],"m":75},{"id":8,"c":10,"t":"Процедура глобального омоложения Age Sammum Guinot","d":"Процедура сочетает в себе высокотехнологичные активные компоненты (витамин С, гиалуроновую кислоту, комплекс \"долгая жизнь клетки\" из 56 нутриентов.","p":[250.0,250.0],"m":75},{"id":9,"c":10,"t":"Ультраувлажняющая процедура Hydra Sammum Guinot","d":"Процедура восстанавливает гидробаланс кожи, повышает плотность кожи, возвращая естественное сияние.","p":[230.0,230.0],"m":75},{"id":10,"c":10,"t":"Процедура детокс+очищение+оксигинация Detoxygene Guinot","d":"Процедура направленная на глубокое очищение кожи от токсинов, интенсивное насыщение клеток кислородом. Идеально подходит для жителей мегаполисов, чья кожа страдает от стресса, усталости, нехватки кислорода.","p":[230.0,230.0],"m":75},{"id":11,"c":10,"t":"Процедура ухода за жирной и проблемной кожей Equilibre Purete Guinot","d":"Процедура глубокого очищения и себорегуляции, направленная на устранение жирного блеска, очищение пор и борьбу с воспалениями без агрессивного воздействия.","p":[230.0,230.0],"m":75},{"id":12,"c":10,"t":"Всесезонный пилинг Hydra РН Guinot","d":"Процедура всесезонного пилинга , разработанного как безопасная и комфортная альтернатива агрессивным медицинским пилингам. Стимулирует клеточное обновление, устраняет признаки старения, осветляет пигментацию и выравнивает рельеф.","p":[220.0,220.0],"m":60},{"id":13,"c":10,"t":"Процедура лифтинга с коллагеновым листом","d":"Уход обеспечивает мгновенный лифтинг, глубокое увлажнение и регенерацию кожи. Прекрасная процедура \"на выход\".","p":[180.0,180.0],"m":75},{"id":14,"c":10,"t":"Биолифтинг с алоэ-вера","d":"Профессиональная процедура \"нехирургической подтяжки\", направленная на мгновенное укрепление овала лица, стимуляцию лимфодренажа и глубокое увлажнение.","p":[190.0,190.0],"m":75},{"id":15,"c":10,"t":"Процедура омолаживающая для чувствительной кожи Hydra marine Dr/Spiller","d":"Профессиональная \"талассо -процедура\" направлена на глубокую детоксикацию, минерализацию и интенсивное увлажнение. Идеально подходит для \"уставшей\", стрессовой чувствительной возрастной кожи.","p":[190.0,190.0],"m":75},{"id":16,"c":10,"t":"Моделирующая лифтинг- процедура с термоактивной маской моделяж Beauty mask","d":"Процедура интенсивного лифтинга с согревающим эффектом для моделирования овала лица. Улучшает кровоснабжение, стимулирует обмен веществ и способствует глубокому проникновению активных препаратов, наносимых под нее.","p":[160.0,160.0],"m":75},{"id":17,"c":10,"t":"Процедура неинвазивной карбокситерапии","d":"Процедура насыщения клеток углекислым газом без инъекций и повреждения кожных покровов. При резком повышении концентрации углекислого газа на поверхности кожи организмом ситуация воспринимается как кислородное голодание, в ответ расширяются капилляры, усиливается местное кровообращение, происходит мощный выброс кислорода в ткани.","p":[150.0,150.0],"m":60},{"id":18,"c":10,"t":"Уход за чувствительной кожей Phytomer","d":"Уход за чувствительной кожей Douceur Marine- это успокаивающий \"кокон-уход\", направленный на мгновенное снятие раздражения, укрепление сосудов и восстановление микробиома кожи.","p":[190.0,190.0],"m":60},{"id":19,"c":10,"t":"Омолаживающая программа GIgi Nutripeptide.","d":"Интеллектуальный пептидный комплекс обеспечивает мгновенное увлажнение и запускает процесс выработки питательных веществ и коллагена. Укрепляет кожу, повышает мягкость и эластичность, устраняет морщины и сухость. Придает коже естественное сияние, здоровый и свежий вид","p":[170.0,170.0],"m":75},{"id":20,"c":10,"t":"Процедура ухода за очень чувствительной кожей Recovery Gigi","d":"Процедура моментально успокаивает и 45},{"id":30,"c":1,"t":"Стрижка детская","d":"Стоимость и продолжительность услуги зависят от сложности стрижки.","p":[30.0,40.0],"m":45},{"id":31,"c":1,"t":"Стрижка мужская наголо","d":"","p":[20.0,20.0],"m":30},{"id":32,"c":1,"t":"Мужской маникюр","d":"","p":[60.0,60.0],"m":60},{"id":33,"c":1,"t":"Мужской педикюр","d":"","p":[95.0,95.0],"m":120},{"id":34,"c":2,"t":"Стрижка женская на короткие (до мочки уха) и средней длины (до лопаток) волосы","d":"Начинаем с диагностики состояния кожи головы и волос, обсуждаем форму стрижки, даем рекомендации по индивидуальному подбору образа. Моем волосы с шампунем по типу волос, используем кондиционер или маску для волос, по желанию. Стрижем и в конце сушим волосы по форме с помощью специальных несмываемых средств.","p":[75.0,75.0],"m":60},{"id":35,"c":2,"t":"Стрижка женская на длинные и очень длинные волосы (ниже лопаток)","d":"Начинаем с диагностики состояния кожи головы и волос, обсуждаем форму стрижки, даем рекомендации по индивидуальному подбору образа. Моем волосы с шампунем по типу волос, используем кондиционер или маску для волос, по желанию. Стрижем и в конце сушим волосы по форме с помощью специальных несмываемых средств.","p":[85.0,85.0],"m":80},{"id":36,"c":3,"t":"Окрашивание корней","d":"Делаем на чистые волосы. Начинаем с диагностики кожи головы и состояния волос. Окрашиваем корни, моем волосы, в конце сушим по форме с помощью специальных несмываемых средств.","p":[140.0,165.0],"m":120},{"id":37,"c":3,"t":"Окрашивание корней + стрижка","d":"Делаем на чистые волосы. Начинаем с диагностики кожи головы и состояния волос. Окрашиваем корни, моем волосы, обсуждаем форму стрижки и даем консультацию по индивидуальному подбору образа. В конце сушим по форме с помощью специальных несмываемых средств.","p":[190.0,215.0],"m":120},{"id":38,"c":3,"t":"Окрашивание в один тон или тонирование","d":"Делаем на чистые волосы. Начинаем с диагностики кожи головы и состояния волос. Окрашиваем или тонируем волосы в один тон, моем волосы, в конце сушим по форме с помощью специальных несмываемых средств.","p":[145.0,175.0],"m":120},{"id":39,"c":3,"t":"Окрашивание в один тон или тонирование + стрижка","d":"Делаем на чистые волосы. Начинаем с диагностики кожи головы и состояния волос. Окрашиваем или тонируем волосы в один тон, моем волосы, обсуждаем форму стрижки, даем рекомендации по индивидуальному подбору образа.  Стрижем и в конце сушим волосы по форме с помощью специальных несмываемых средств.","p":[195.0,235.0],"m":165},{"id":40,"c":3,"t":"Осветление корней+ тонирование","d":"Делаем на чистые волосы. Начинаем с диагностики кожи головы и состояния волос. Осветляем корни, тонируем волосы от корней до кончиков, объединяя цвет. Моем волосы, в конце сушим по форме с помощью специальных несмываемых средств.","p":[230.0,280.0],"m":180},{"id":41,"c":3,"t":"Осветление корней+ тонирование + стрижка","d":"Делаем на чистые волосы. Начинаем с диагностики кожи головы и состояния волос. Осветляем корни, тонируем волосы от корней до кончиков, объединяя цвет. Моем волосы. Обсуждаем форму стрижки, подбираем индивидуально образ, стрижем,  в конце сушим по форме с помощью специальных несмываемых средств","p":[280.0,340.0],"m":225},{"id":42,"c":3,"t":"Контуринг","d":"Делаем на чистые волосы. Начинаем с диагностики кожи головы и состояния волос. Осветляем пряди у лица, на висках и кончиках, создавая блики.Моем волосы, в конце сушим по форме с помощью специальных несмываемых средств.","p":[170.0,200.0],"m":120},{"id":43,"c":3,"t":"Контуринг + стрижка","d":"Делаем на чистые волосы. Начинаем с диагностики кожи головы и состояния волос. Осветляем пряди у лица, на висках и кончиках, создавая блики. Моем волосы, обсуждаем форму стрижки, даем рекомендации по индивидуальному подбору образа.  Стрижем и в конце сушим волосы по форме с помощью специальных несмываемых средств.","p":[220.0,250.0],"m":165},{"id":44,"c":3,"t":"Частичное рассветление (топовая зона с добавлением прядей 10-15%)","d":"Если у вас очень длинные и густые волосы, то возможно увеличение стоимости услуги. О чем мы вас обязательно проинформируем в ходе консультации до начала работы.","p":[180.0,220.0],"m":180},{"id":45,"c":3,"t":"Частичное рассветление (топовая зона с добавлением прядей 10-15%) + стрижка","d":"Если у вас очень длинные и густые волосы, то возможно увеличение стоимости услуги. О чем мы вас обязательно проинформируем в ходе консультации до начала работы.","p":[230.0,260.0],"m":225},{"id":46,"c":3,"t":"Мелирование короткие волосы (до мочки уха)","d":"Делаем на чистые волосы. Начинаем с диагностики кожи головы и состояния волос. Осветляем волосы. Моем волосы, в конце сушим по форме с помощью специальных несмываемых средств.","p":[160.0,210.0],"m":135},{"id":47,"c":3,"t":"Мелирование короткие волосы (до мочки уха) + стрижка","d":"Делаем на чистые волосы. Начинаем с диагностики кожи головы и состояния волос. Осветляем волосы.  Обсуждаем форму стрижки и подбираем индивидуальный образ. Моем волосы, в конце сушим по форме с помощью специальных несмываемых средств.","p":[210.0,250.0],"m":180},{"id":48,"c":3,"t":"Мелирование короткие волосы (до мочки уха) + тонирование","d":"Делаем на чистые волосы. Начинаем с диагностики кожи головы и состояния волос. Осветляем волосы, тонируем волосы от корней до кончиков. Моем волосы, в конце сушим по форме с помощью специальных несмываемых средств.","p":[210.0,270.0],"m":180},{"id":49,"c":3,"t":"Мелирование короткие волосы (до мочки уха) + тонирование+стрижка","d":"Делаем на чистые волосы. Начинаем с диагностики кожи головы и состояния волос. Осветляем волосы, тонируем волосы от корней до кончиков. Моем волосы, обсуждаем форму стрижки, даем рекомендации по индивидуальному подбору образа.  Стрижем и в конце сушим волосы по форме с помощью специальных несмываемых средств.","p":[260.0,320.0],"m":240},{"id":50,"c":3,"t":"Сложное окрашивание (волосы до мочки уха)","d":"Запишитесь на бесплатную консультацию, чтобы результат соответствовал ожиданиям. Оценим состояние волос, сделаем тес const MG = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
const MS = ["янв", "фев", "мар", "апр", "мая", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
const MN = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];

const dayShort = (d) => `${WD[wd(d)]}, ${+d.slice(8)} ${MS[+d.slice(5, 7) - 1]}`;
const dur = (m) => { const h = Math.floor(m / 60), r = m % 60; return h && r ? `${h} ч ${r} мин` : h ? `${h} ч` : `${r} мин`; };
const price = (a, b) => { const f = (n) => Number.isInteger(n) ? n : n.toFixed(2); return a === b ? `${f(a)} ${CUR}` : `${f(a)} – ${f(b)} ${CUR}`; };
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 12 || h > 14) ? b : c; };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

}
/** услуга в исполнении мастера: его цена и длительность */
function staffSvc(staff, id) {
  const row = staff.s.find((x) => x[0] === id);
  if (!row) return null;
  const s = service(id);
  const edited = store && store.svc[id];
  // правка цены в админке применяется и к мастерам
  return { id, t: s.t, p: edited && edited.p ? s.p : [row[1], row[2]], m: edited && edited.m ? s.m : row[3] };
}
function shifts(staffId, date) {
  if (wd(date) === 6) return [];
  if (staffId % 4 === 0 && wd(date) === 0) return []; // у части мастеров выходной в понедельник
  return staffId % 2 ? [[540, 1260]] : [[600, 1200]];
}
const ACTIVE = (b) => b.status !== "CANCELLED" && b.status !== "NO_SHOW";

function seedBookings() {
  // правдоподобная загрузка на неделю вперёд; имена — примеры
  const names = ["Алина", "Ольга К.", "Мария", "Екатерина С.", "Дарья", "Виктория", "Анна", "Юлия М.", "Наталья", "Кристина", "Светлана", "Ксения", "Полина", "Татьяна В.", "Андрей", "Дмитрий", "Сергей", "Елена"];
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const now = minskNow();
  const out = [];
  let id = 1;
  for (let d = -1; d < 8; d++) {
    const date = addDays(now.date, d);
    for (const st of DATA.staff) {
      for (const [s, e] of shifts(st.id, date)) {
        let t = s + Math.floor(rnd() * 3) * 30;
        while (t < e - 60) {
          if (rnd() < 0.42) {
            const row = st.s[Math.floor(rnd() * st.s.length)];
            const m = row[3];
            if (t + m > e) break;
            const status = d < 0 || (d === 0 && t + m < now.min) ? (rnd() < 0.9 ? "ARRIVED" : "NO_SHOW") : rnd() < 0.3 ? "CONFIRMED" : "BOOKED";
            const n = names[Math.floor(rnd() * names.length)];
            out.push({ id: id++, staffId: st.id, date, start: t, end: t + m, client: { name: n, phone: "+37529" + String(1000000 + Math.floor(rnd() * 8999999)) },
              items: [{ t: service(row[0]).t, p: [row[1], row[2]] }], status, comment: "", source: rnd() < 0.55 ? "ONLINE" : "ADMIN", seen: true });
            t += m + Math.floor(rnd() * 2) * 30;
            t = Math.ceil(t / 30) * 30;
          } else t += 60;
        }
      }
    }
  }
  return out;
}

// ---------- свободное время ----------
function freeSlots(staffId, date, len) {
  const now = minskNow();
  if (date < now.date) return [];
  const notBefore = date === now.date ? now.min + 60 : 0;
  const busy = store.bookings.filter((b) => b.staffId === staffId && b.date === date && ACTIVE(b)).map((b) => [b.start, b.end]).sort((a, b) => a[0] - b[0]);
  const out = new Set();
  for (const [s, e] of shifts(staffId, date)) {
    let cur = s;
    const free = [];
    for (const [bs, be] of busy) {
      if (be <= cur || bs >= e) continue;
      if (bs > cur) free.push([cur, bs]);
      cur = Math.max(cur, be);
    }
    if (cur < e) free.push([cur, e]);
    for (const [fs, fe] of free) {
      if (fs + len > fe) continue;
      if (fs >= notBefore) out.add(fs);
      for (let t = Math.ceil(fs / STEP) * STEP; t + len <= fe; t += STEP) if (t >= notBefore) out.add(t);
    }
  }
  return [...out].sort((a, b) => a - b);
}
function offers(svcIds) {
  return DATA.staff.filter((s) => s.b && svcIds.every((id) => s.s.some((x) => x[0] === id))).map((s) => {
    const items = svcIds.map((id) => staffSvc(s, id));
    return { staff: s, len: svcIds.length ? items.reduce((a, i) => a + i.m, 0) : STEP, p: items.reduce((a, i) => [a[0] + i.p[0], a[1] + i.p[1]], [0, 0]) };
  });
}
/** время → мастера, свободные в это время */
function daySlots(date, staffId, svcIds) {
  const map = new Map();
  for (const o of offers(svcIds)) {
    if (staffId && o.staff.id !== staffId) continue;
    for (const t of freeSlots(o.staff.id, date, o.len)) map.set(t, [...(map.get(t) || []), o.staff.id]);
  }
  return map;
}

}

function toast(title, text) {
  const root = document.getElementById("toast-root");
  root.innerHTML = `<div class="toast" role="status"><b>${esc(title)}</b>${esc(text)}</div>`;
  clearTimeout(toast.t);
  toast.t = setTimeout(() => (root.innerHTML = ""), 5500);
}

// ---------- отрисовка ----------
function render() {
  document.querySelectorAll(".seg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === ui.mode)));
  document.getElementById("app").innerHTML = ui.mode === "client" ? vClient() : ui.mode === "master" ? vMaster() : vAdmin();
  renderSheet();
  markSeenLater();
}
function renderSheet() {
  document.getElementById("sheet-root").innerHTML = vSheet();
  document.body.style.overflow = ui.sheet ? "hidden" : "";
}
const top0 = () => window.scrollTo(0, 0);

// ---------- действия ----------
const A = {
  mode(d) { ui.mode = d.v; ui.sheet = null; try { localStorage.setItem(KEY + "-mode", d.v); } catch (e) {} render(); top0(); },
  close() { ui.sheet = null; renderSheet(); },
  "close-ov"(d, e) { if (e.target.classList.contains("ov")) { ui.sheet = null; renderSheet(); } },
  "see-master"() { ui.m.staffId = ui.c.done.staffId; ui.m.date = ui.c.done.date; A.mode({ v: "master" }); },

  "c-home"() { ui.c.screen = "menu"; ui.c.pickStaff = undefined; render(); top0(); },
  "c-go-staff"() { ui.c.screen = "staff"; ui.c.pickStaff = undefined; render(); top0(); },
  "c-go-services"() { ui.c.screen = "services"; ui.c.q = ""; render(); top0(); },
  "c-go-time"() { const c = ui.c; c.screen = "time"; c.timeStaff = c.staffId; c.date = null; c.month = null; c.pickAt = c.at; render(); top0(); },
  "c-confirm"() { ui.c.screen = "confirm"; ui.c.err = null; render(); top0(); },
  "c-pick-staff"(d) { ui.c.pickStaff = +d.id || null; if (d.close) ui.sheet = null; render(); },
  "c-staff-info"(d) { ui.sheet = { kind: "staff-info", id: +d.id }; renderSheet(); },
  "c-staff-slot"(d) { const c = ui.c; c.staffId = +d.id; c.at = { date: d.d, min: +d.t }; c.pickStaff = undefined; cNext(); render(); top0(); },
  "c-staff-other"(d) { const c = ui.c; c.staffId = +d.id; c.at = null; c.pickStaff = undefined; c.screen = "time"; c.timeStaff = c.staffId; c.date = null; c.month = null; c.pickAt = null; render(); top0(); },
  "c-staff-done"() { const c = ui.c; const sel = c.pickStaff === undefined ? c.staffId : c.pickStaff; if (sel !== c.staffId) { c.at = null; c.svc = c.svc.filter((id) => !sel || staffById.get(sel).s.some((r) => r[0] === id)); } c.staffId = sel; c.pickStaff = undefined; cNext(); render(); top0(); },
  "c-toggle-svc"(d) { const c = ui.c, id = +d.id; c.svc = c.svc.includes(id) ? c.svc.filter((x) => x !== id) : [...c.svc, id]; document.getElementById("svc-list").innerHTML = svcList(); document.getElementById("svc-bottom").innerHTML = svcBottom(); },
  "c-more"(d) { ui.c.expanded[d.id] = !ui.c.expanded[d.id]; document.getElementById("svc-list").innerHTML = svcList(); },
  "c-cat"(d) { const el = document.getElementById("cat-" + d.id); if (el) el.scrollIntoView({ behavior: "smooth" }); },
  "c-svc-done"() { cNext(); render(); top0(); },
  "c-time-staff"(d) { const c = ui.c; c.timeStaff = +d.id || null; c.pickAt = null; c.date = null; render(); },
  "c-month"(d) { const c = ui.c; const [y, m] = c.month.split("-").map(Number); c.month = new Date(Date.UTC(y, m - 1 + +d.d, 1)).toISOString().slice(0, 7); render(); },
  "c-day"(d) { ui.c.date = d.d; ui.c.pickAt = null; render(); },
  "c-slot"(d) { ui.c.pickAt = { date: ui.c.date, min: +d.t }; render(); },
  "c-time-done"() { const c = ui.c; c.at = c.pickAt; c.staffId = c.timeStaff; cNext(); render(); top0(); },
  "c-new"() { Object.assign(ui.c, { screen: "menu", staffId: null, svc: [], at: null, done: null, err: null }); render(); top0(); },

  "m-day"(d) { ui.m.date = d.d; render(); },
  "m-status"(d) { const b = store.bookings.find((x) => x.id === +d.id); b.status = d.s; save(); render(); },

  "a-tab"(d) { ui.a.tab = d.v; render(); },
  "a-day"(d) { ui.a.date = addDays(ui.a.date, +d.d); render(); },
  "a-today"() { ui.a.date = minskNow().date; render(); },
  "a-open"(d) { ui.sheet = { kind: "appt", id: +d.id }; renderSheet(); },
  "a-cancel-ask"() { ui.sheet.confirmCancel = true; renderSheet(); },
  "a-cancel-no"() { ui.sheet.confirmCancel = false; renderSheet(); },
  "a-status"(d) {
    const b = store.bookings.find((x) => x.id === +d.id);
    if (d.s === "BOOKED" && b.status === "CANCELLED") {
      const clash = store.bookings.some((x) => x.id !== b.id && x.staffId === b.staffId && x.date === b.date && ACTIVE(x) && x.start < b.end && b.start < x.end);
      if (clash) { toast("Нельзя восстановить", "У мастера уже есть запись на это время"); return; }
    }
    const wasCancelled = b.status !== "CANCELLED" && d.s === "CANCELLED";
    b.status = d.s; save();
    if (wasCancelled) { ui.sheet = null; toast(`Уведомление мастеру ${staffById.get(b.staffId).n}: запись отменена`, `${dayShort(b.date)}, ${hm(b.start)} — ${b.client.name}`); }
    else ui.sheet.confirmCancel = false;
    render();
  },
  "a-new"(d) { ui.sheet = { kind: "new", staffId: +d.id, t: +d.t }; renderSheet(); },
  "a-svc"(d) { ui.sheet = { kind: "svc", id: +d.id }; renderSheet(); },
  "a-reset"() { store = { v: 1, svc: {}, bookings: seedBookings(), nextId: 1000 }; save(); toast("Демо сброшено", "Записи и цены вернулись к исходным"); render(); },
};

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-a]");
  if (!el || el.disabled) return;
  const fn = A[el.dataset.a];
  if (fn) fn(el.dataset, e);
});
document.addEventListener("input", (e) => {
  if (e.target.id === "svc-q") { ui.c.q = e.target.value; document.getElementById("svc-list").innerHTML = svcList(); }
});
document.addEventListener("change", (e) => {
  if (e.target.id === "m-staff") { ui.m.staffId = +e.target.value; render(); }
});
document.addEventListener("submit", (e) => {
  e.preventDefault();
  const v = (id) => (document.getElementById(id) || {}).value || "";
  if (e.target.id === "book-form") {
    const c = ui.c;
    const name = v("f-name").trim();
    let digits = v("f-phone").replace(/\D/g, "");
    if (digits.startsWith("80")) digits = digits.slice(2);
    if (!digits.startsWith("375")) digits = "375" + digits;
    if (!name) c.err = "Введите имя";
    else if (digits.length !== 12) c.err = "Проверьте номер телефона: 9 цифр после +375";
    else if (!document.getElementById("f-consent").checked) c.err = "Нужно согласие на обработку персональных данных";
    else {
      const free = daySlots(c.at.date, c.staffId, c.svc).get(c.at.min) || [];
      if (!free.length) c.err = "Это время только что заняли. Выберите другое.";
      else {
        const st = staffById.get(c.staffId || free[0]);
        const items = c.svc.map((id) => staffSvc(st, id));
        const b = { id: store.nextId++, staffId: st.id, date: c.at.date, start: c.at.min, end: c.at.min + items.reduce((a, i) => a + i.m, 0),
          client: { name, phone: "+" + digits }, items: items.map((i) => ({ t: i.t, p: i.p })), status: "BOOKED", comment: v("f-comment").trim(), source: "ONLINE", seen: false };
        store.bookings.push(b); save();
        c.done = b; c.screen = "done"; c.err = null;
        render(); top0();
        setTimeout(() => toast(`Уведомление мастеру ${st.n}: новая запись`, `${dayShort(b.date)}, ${hm(b.start)} — ${name}, ${b.items.map((i) => i.t).join(", ")}`), 700);
        return;
      }
    }
    render();
    const err = document.querySelector(".err"); if (err) err.scrollIntoView({ block: "center" });
  }
  if (e.target.id === "new-form") {
    const s = ui.sheet, st = staffById.get(s.staffId);
    const ids = [...document.querySelectorAll("input[name=n-svc]:checked")].map((x) => +x.value);
    const [hh, mm] = v("n-time").split(":").map(Number);
    const start = hh * 60 + mm, name = v("n-name").trim(), phone = v("n-phone").trim();
    const items = ids.map((id) => staffSvc(st, id));
    const end = start + items.reduce((a, i) => a + i.m, 0);
    if (!name || phone.replace(/\D/g, "").length < 9) s.err = "Укажите имя и телефон клиента";
    else if (!ids.length) s.err = "Выберите хотя бы одну услугу";
    else if (store.bookings.some((x) => x.staffId === st.id && x.date === ui.a.date && ACTIVE(x) && x.start < end && start < x.end)) s.err = "У мастера уже есть запись на это время";
    else {
      const b = { id: store.nextId++, staffId: st.id, date: ui.a.date, start, end, client: { name, phone }, items: items.map((i) => ({ t: i.t, p: i.p })), status: "BOOKED", comment: "", source: "ADMIN", seen: false };
      store.bookings.push(b); save(); ui.sheet = null; render();
      toast(`Уведомление мастеру ${st.n}: новая запись`, `${dayShort(b.date)}, ${hm(start)} — ${name}`);
      return;
    }
    renderSheet();
  }
  if (e.target.id === "svc-form") {
    const s = ui.sheet;
    const t = v("s-t").trim(), p0 = +v("s-p0"), p1 = Math.max(+v("s-p1"), p0), m = +v("s-m");
    if (!t) s.err = "Введите название";
    else if (!(m >= 5)) s.err = "Длительность — от 5 минут";
    else {
      store.svc[s.id] = { t, p: [p0, p1], m, online: document.getElementById("s-on").checked }; save();
      ui.sheet = null; render(); toast("Сохранено", `${t}: ${price(p0, p1)}, ${dur(m)}`); return;
    }
    renderSheet();
  }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && ui.sheet) { ui.sheet = null; renderSheet(); } });

render();
</script>
